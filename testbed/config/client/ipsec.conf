# StrongSwan configuration - CLIENT peer (10.0.1.2)
#
# Two scenarios are defined; only the first starts automatically. To exercise
# the second:  ipsec down tunnel-aes128 && ipsec up tunnel-aes256
#
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=no

# Scenario 1 - deliberately WEAK suite (AES-128 / SHA1 / modp2048, no PFS).
# Generates captures that the analyzer should flag as high risk.
conn tunnel-aes128
    left=10.0.1.2
    leftsubnet=10.0.1.2/32
    right=10.0.1.3
    rightsubnet=10.0.1.3/32
    ike=aes128-sha1-modp2048
    esp=aes128-sha1
    keyexchange=ikev2
    auto=start
    type=tunnel
    pfs=no
    keylife=8h

# Scenario 2 - STRONG suite (AES-256-GCM / SHA-384 / ecp384 with PFS)
conn tunnel-aes256
    left=10.0.1.2
    leftsubnet=10.0.1.2/32
    right=10.0.1.3
    rightsubnet=10.0.1.3/32
    ike=aes256gcm16-sha384-ecp384
    esp=aes256gcm16-ecp384
    keyexchange=ikev2
    auto=add
    type=tunnel
    pfs=yes
    keylife=1h

# Scenario 3 - Transport mode variant (host-to-host, no subnet selectors)
conn transport-aes128
    left=10.0.1.2
    right=10.0.1.3
    ike=aes128-sha256-modp2048
    esp=aes128-sha256
    keyexchange=ikev2
    auto=add
    type=transport
    pfs=no
