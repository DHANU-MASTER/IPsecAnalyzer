# StrongSwan configuration - SERVER peer (10.0.1.3)
#
# Accepts the client's scenarios. Selectors mirror the client side so the
# host-to-host tunnel covers traffic between 10.0.1.2 and 10.0.1.3.
config setup
    charondebug="ike 1, knl 1, cfg 0"
    uniqueids=no

# Scenario 1 - weak suite (matches client tunnel-aes128)
conn tunnel-aes128
    left=10.0.1.3
    leftsubnet=10.0.1.3/32
    right=10.0.1.2
    rightsubnet=10.0.1.2/32
    ike=aes128-sha1-modp2048
    esp=aes128-sha1
    keyexchange=ikev2
    auto=add
    type=tunnel
    pfs=no
    keylife=8h

# Scenario 2 - strong suite (matches client tunnel-aes256)
conn tunnel-aes256
    left=10.0.1.3
    leftsubnet=10.0.1.3/32
    right=10.0.1.2
    rightsubnet=10.0.1.2/32
    ike=aes256gcm16-sha384-ecp384
    esp=aes256gcm16-ecp384
    keyexchange=ikev2
    auto=add
    type=tunnel
    pfs=yes
    keylife=1h

# Scenario 3 - transport mode variant
conn transport-aes128
    left=10.0.1.3
    right=10.0.1.2
    ike=aes128-sha256-modp2048
    esp=aes128-sha256
    keyexchange=ikev2
    auto=add
    type=transport
    pfs=no
