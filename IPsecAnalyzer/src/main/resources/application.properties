server.port=8080
spring.application.name=IPsec-Analyzer

# Database (PostgreSQL with fallback to local securepass123)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ipsec_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:securepass123}
spring.jpa.hibernate.ddl-auto=update

# REST API only - no OSIV needed; silences the Hibernate warning
spring.jpa.open-in-view=false


# File upload limits
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Security JWT
security.jwt.secret=${JWT_SECRET:your-super-secret-key-change-in-prod}
security.jwt.expiration=3600000

# Encryption for password storage
spring.security.password.encoder=bcrypt

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# Layer-5 morphic defense: real scheduled rotation (master prompt: every 15 min)
morphic.enabled=${MORPHIC_ENABLED:true}
morphic.interval-minutes=${MORPHIC_INTERVAL_MINUTES:15}

# First-boot admin bootstrap: random password generated at startup, written
# once to admin.credentials-file. No shared demo password is seeded anywhere.
admin.bootstrap-enabled=${ADMIN_BOOTSTRAP_ENABLED:true}
admin.credentials-file=${ADMIN_CREDENTIALS_FILE:.admin-credentials}
