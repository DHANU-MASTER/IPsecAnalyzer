<!DOCTYPE html>
<html>
<head>
    <title>IPsec Analyzer - Secure Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header h1 {
            color: #333;
            font-weight: bold;
        }
        .login-header p {
            color: #999;
            font-size: 14px;
        }
        .alert-danger {
            margin-bottom: 20px;
        }
        .security-badge {
            font-size: 12px;
            color: #28a745;
            margin-top: 15px;
            text-align: center;
        }
        .form-control {
            border-radius: 5px;
            padding: 10px 15px;
            margin-bottom: 15px;
        }
        .btn-login {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            font-weight: bold;
        }
        #ipInfo {
            font-size: 12px;
            color: #666;
            margin-top: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>🔐 IPsec Analyzer</h1>
            <p>Secure Government Cybersecurity Tool</p>
        </div>
        
        <div id="errorAlert" class="alert alert-danger" style="display:none;"></div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-control" required placeholder="Enter username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" class="form-control" required placeholder="Enter password">
            </div>
            
            <button type="submit" class="btn btn-primary btn-login">Login</button>
        </form>
        
        <div id="ipInfo">
            Your IP: <strong id="userIp">Loading...</strong>
            <br>
            <small>⚠️ Repeated failed logins will lock your account for 30 minutes</small>
        </div>
        
        <div class="security-badge">
            ✓ JWT Token Authentication
            <br>
            ✓ Device Fingerprinting &amp; Login Audit
            <br>
            ✓ Rate Limiting: 4 Attempts Max (account lockout 30 min)
        </div>
    </div>
    
    <script>
        // Get user's IP from this application (no external service required)
        async function getClientIp() {
            try {
                const response = await fetch('/api/public/client-ip');
                const data = await response.json();
                document.getElementById('userIp').textContent = data.ip || 'unknown';
            } catch (e) {
                document.getElementById('userIp').textContent = 'Unable to fetch';
            }
        }
        
        // Handle login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorAlert = document.getElementById('errorAlert');
            
            try {
                const response = await fetch('/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    // Store JWT token
                    localStorage.setItem('authToken', data.token);
                    
                    // Redirect to dashboard
                    window.location.href = '/dashboard';
                } else {
                    // Show error
                    errorAlert.textContent = data.message;
                    errorAlert.style.display = 'block';
                }
            } catch (error) {
                errorAlert.textContent = 'Connection error: ' + error.message;
                errorAlert.style.display = 'block';
            }
        });
        
        // Load IP on page load
        window.addEventListener('load', getClientIp);
    </script>
</body>
</html>
